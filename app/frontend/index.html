<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto Dashboard Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <script src="https://unpkg.com/htmx.org/dist/ext/json-enc.js"></script>

    <script>
        // Função para formatar valores em Reais (R$)
        const formatarMoeda = (valor) => {
            return valor.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
        };

        function carregarMoedas() {
            fetch('http://localhost:8080/cripto')
                .then(response => response.json())
                .then(data => {
                    const tbody = document.getElementById('tabela-moedas');
                    tbody.innerHTML = ''; 
                    
                    let saldoTotal = 0;
                    let totalAtivos = 0;

                    data.forEach(moeda => {
                        // Calcula o total investido nesta moeda específica
                        const valorTotalMoeda = moeda.quantidade * moeda.preco_medio;
                        saldoTotal += valorTotalMoeda;
                        totalAtivos++;

                        const tr = document.createElement('tr');
                        tr.className = "hover:bg-gray-800 transition duration-150 border-b border-gray-700";
                        tr.innerHTML = `
                            <td class="p-4 font-medium text-white flex items-center gap-3">
                                <div class="w-8 h-8 rounded-full bg-emerald-900 text-emerald-400 flex items-center justify-center font-bold text-xs">
                                    ${moeda.ticker.substring(0,2)}
                                </div>
                                ${moeda.nome}
                            </td>
                            <td class="p-4 text-gray-300">
                                <span class="bg-gray-700 text-gray-200 py-1 px-3 rounded-md text-xs font-bold border border-gray-600">${moeda.ticker}</span>
                            </td>
                            <td class="p-4 text-gray-300">${moeda.quantidade}</td>
                            <td class="p-4 text-gray-300">${formatarMoeda(moeda.preco_medio)}</td>
                            <td class="p-4 font-bold text-emerald-400">${formatarMoeda(valorTotalMoeda)}</td>
                            <td class="p-4 text-right">
                                <button onclick="deletarMoeda(${moeda.id_cripto})" class="text-red-400 hover:text-red-300 bg-red-400/10 hover:bg-red-400/20 px-3 py-1 rounded transition">Excluir</button>
                            </td>
                        `;
                        tbody.appendChild(tr);
                    });

                    // Atualiza os cartões de resumo no topo
                    document.getElementById('saldo-total').innerText = formatarMoeda(saldoTotal);
                    document.getElementById('total-ativos').innerText = totalAtivos;
                });
        }

        function deletarMoeda(id) {
            if(confirm("Tem certeza que deseja remover este ativo da carteira?")) {
                fetch(`http://localhost:8080/cripto/${id}`, { method: 'DELETE' })
                    .then(() => carregarMoedas());
            }
        }

        window.onload = carregarMoedas;
    </script>
</head>
<body class="bg-gray-950 text-gray-100 font-sans min-h-screen">

    <header class="bg-gray-900 border-b border-gray-800 p-4 sticky top-0 z-10">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-2">
                <div class="w-3 h-3 bg-emerald-500 rounded-full animate-pulse"></div>
                <h1 class="text-xl font-bold tracking-wider text-white">CRYPTO<span class="text-emerald-500">PORTFOLIO</span></h1>
            </div>
            <div class="flex items-center gap-4 text-sm text-gray-400">
                <span>Status do Servidor: <span class="text-emerald-400">Online</span></span>
            </div>
        </div>
    </header>

    <main class="max-w-6xl mx-auto p-6 mt-4">
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
            <div class="bg-gray-900 p-6 rounded-xl border border-gray-800 shadow-lg relative overflow-hidden">
                <div class="absolute top-0 right-0 w-24 h-24 bg-emerald-500/10 rounded-bl-full"></div>
                <h3 class="text-gray-400 text-sm font-semibold mb-1">Patrimônio Total Investido</h3>
                <p id="saldo-total" class="text-3xl font-bold text-white">R$ 0,00</p>
            </div>
            <div class="bg-gray-900 p-6 rounded-xl border border-gray-800 shadow-lg relative overflow-hidden">
                <div class="absolute top-0 right-0 w-24 h-24 bg-blue-500/10 rounded-bl-full"></div>
                <h3 class="text-gray-400 text-sm font-semibold mb-1">Ativos na Carteira</h3>
                <p id="total-ativos" class="text-3xl font-bold text-white">0</p>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            
            <div class="lg:col-span-1">
                <div class="bg-gray-900 p-6 rounded-xl shadow-lg border border-gray-800 sticky top-24">
                    <h2 class="text-lg font-bold mb-4 text-white flex items-center gap-2">
                        <span>➕</span> Novo Aporte
                    </h2>
                    
                    <form id="formCripto" hx-ext="json-enc" class="flex flex-col gap-4">
                        <input type="hidden" name="id_cripto" value="0">

                        <div>
                            <label class="block text-xs font-semibold text-gray-400 uppercase mb-1">Nome do Ativo</label>
                            <input type="text" name="nome" placeholder="Ex: Solana" class="w-full bg-gray-950 text-white border border-gray-700 rounded-lg p-2.5 focus:outline-none focus:border-emerald-500" required>
                        </div>
                        
                        <div>
                            <label class="block text-xs font-semibold text-gray-400 uppercase mb-1">Ticker</label>
                            <input type="text" name="ticker" placeholder="Ex: SOL" class="w-full bg-gray-950 text-white border border-gray-700 rounded-lg p-2.5 focus:outline-none focus:border-emerald-500" required>
                        </div>

                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-xs font-semibold text-gray-400 uppercase mb-1">Qtd</label>
                                <input type="number" step="any" name="quantidade" placeholder="0.00" class="w-full bg-gray-950 text-white border border-gray-700 rounded-lg p-2.5 focus:outline-none focus:border-emerald-500" required>
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-gray-400 uppercase mb-1">Preço Médio</label>
                                <input type="number" step="any" name="preco_medio" placeholder="R$ 0,00" class="w-full bg-gray-950 text-white border border-gray-700 rounded-lg p-2.5 focus:outline-none focus:border-emerald-500" required>
                            </div>
                        </div>
                        
                        <button type="submit" 
                                hx-post="http://localhost:8080/cripto"
                                hx-swap="none"
                                hx-on::after-request="carregarMoedas(); document.getElementById('formCripto').reset();"
                                class="mt-2 bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 px-6 rounded-lg transition duration-200 w-full shadow-lg shadow-emerald-900/20">
                            Registrar Compra
                        </button>
                    </form>
                </div>
            </div>

            <div class="lg:col-span-2">
                <div class="bg-gray-900 rounded-xl shadow-lg border border-gray-800 overflow-hidden">
                    <div class="p-6 border-b border-gray-800 flex justify-between items-center">
                        <h2 class="text-lg font-bold text-white">Seus Ativos</h2>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left text-sm">
                            <thead>
                                <tr class="bg-gray-950 text-gray-400 uppercase tracking-wider text-xs">
                                    <th class="p-4 font-semibold">Ativo</th>
                                    <th class="p-4 font-semibold">Ticker</th>
                                    <th class="p-4 font-semibold">Qtd</th>
                                    <th class="p-4 font-semibold">Preço Médio</th>
                                    <th class="p-4 font-semibold text-emerald-400">Total (R$)</th>
                                    <th class="p-4 font-semibold text-right">Ação</th>
                                </tr>
                            </thead>
                            <tbody id="tabela-moedas" class="divide-y divide-gray-800 bg-gray-900">
                                </tbody>
                        </table>
                    </div>
                </div>
            </div>

        </div>
    </main>

</body>
</html>
